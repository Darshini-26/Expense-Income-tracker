<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Financial Tracker</h1>
    </header>

    <main>
        <section id="user-section">
            <h2>Create User</h2>
            <form id="create-user-form">
                <label for="user-name">Name:</label>
                <input type="text" id="user-name" required>
                <label for="user-email">Email:</label>
                <input type="email" id="user-email" required>
                <button type="submit">Create User</button>
            </form>
            <div id="user-response"></div>
        </section>

        <section id="income-section">
            <h2>Create Income</h2>
            <form id="create-income-form">
                <label for="income-email">User Email:</label>
                <input type="email" id="income-email" required>
                <label for="income-amount">Amount:</label>
                <input type="number" id="income-amount" required>
                <label for="income-date">Date:</label>
                <input type="date" id="income-date" required>
                <label for="income-description">Description:</label>
                <input type="text" id="income-description">
                <label for="income-account">Account ID:</label>
                <input type="number" id="income-account" required>
                <label for="income-category">Category ID:</label>
                <input type="number" id="income-category" required>
                <button type="submit">Create Income</button>
            </form>
            <div id="income-response"></div>
        </section>

        <section id="data-section">
            <h2>Download Data</h2>
            <form id="download-data-form">
                <label for="data-email">User Email (optional):</label>
                <input type="email" id="data-email">
                <button type="submit">Download CSV</button>
            </form>
        </section>
    </main>

    <script>
        document.getElementById('create-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('user-name').value;
            const email = document.getElementById('user-email').value;

            const response = await fetch('http://ec2-54-90-101-46.compute-1.amazonaws.com:8000.', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name, email }),
            });

            const result = await response.json();
            document.getElementById('user-response').innerText = result.message || 'User created successfully!';
        });

        document.getElementById('create-income-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('income-email').value;
            const amount = parseFloat(document.getElementById('income-amount').value);
            const date = document.getElementById('income-date').value;
            const description = document.getElementById('income-description').value;
            const account_id = parseInt(document.getElementById('income-account').value);
            const category_id = parseInt(document.getElementById('income-category').value);

            const response = await fetch('http://ec2-54-90-101-46.compute-1.amazonaws.com:8000.', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email,
                    amount,
                    date,
                    description,
                    account_id,
                    category_id,
                }),
            });

            const result = await response.json();
            document.getElementById('income-response').innerText = result.message || 'Income created successfully!';
        });

        document.getElementById('download-data-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('data-email').value;

            const url = `http://ec2-54-90-101-46.compute-1.amazonaws.com:8000.=${email}`;
            window.open(url, '_blank');
        });
    </script>
</body>
</html>
